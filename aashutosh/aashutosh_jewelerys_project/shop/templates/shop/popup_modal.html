{% load static %}
<!-- ======== DISCOUNT POPUP MODAL ======== -->
{% if popup %}
<div class="popup-modal-overlay" id="popupModal">
    <div class="popup-modal-container">
        <!-- Close Button -->
        <button class="popup-close-btn" id="closePopupBtn">
            <i class="fas fa-times"></i>
        </button>

        <!-- Popup Content -->
        <div class="popup-content">
            {% if popup.poster_image %}
                <!-- Show Poster Image if available -->
                <div class="popup-poster">
                    <img src="{{ popup.poster_image.url }}" alt="{{ popup.title }}" class="popup-poster-img">
                </div>
            {% else %}
                <!-- Show Text Message if no poster -->
                <div class="popup-text">
                    <div class="popup-icon">
                        <i class="fas fa-gift"></i>
                    </div>
                    <h3 class="popup-title">{{ popup.title }}</h3>
                    {% if popup.message %}
                        <p class="popup-message">{{ popup.message }}</p>
                    {% endif %}
                    <button class="popup-action-btn" onclick="document.getElementById('closePopupBtn').click()">
                        Shop Now <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            {% endif %}
        </div>

        <!-- Don't Show Again Checkbox -->
        <div class="popup-footer">
            <label class="popup-dont-show">
                <input type="checkbox" id="dontShowAgain">
                <span>Don't show again today</span>
            </label>
        </div>
    </div>
</div>

<!-- Popup CSS -->
<style>
    /* Popup Modal Overlay */
    .popup-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(5px);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
    }

    .popup-modal-overlay.show {
        opacity: 1;
        visibility: visible;
    }

    /* Popup Container */
    .popup-modal-container {
        position: relative;
        max-width: 90%;
        max-height: 90vh;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        transform: scale(0.8);
        transition: transform 0.3s ease;
    }

    .popup-modal-overlay.show .popup-modal-container {
        transform: scale(1);
    }

    /* Close Button */
    .popup-close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 40px;
        height: 40px;
        border: none;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: all 0.3s ease;
        z-index: 10;
    }

    .popup-close-btn:hover {
        background: rgba(0, 0, 0, 0.8);
        transform: rotate(90deg);
    }

    /* Popup Content */
    .popup-content {
        width: 100%;
        height: 100%;
    }

    /* Poster Image Style */
    .popup-poster {
        width: 100%;
        height: 100%;
    }

    .popup-poster-img {
        width: 100%;
        height: auto;
        max-height: 80vh;
        object-fit: contain;
        display: block;
    }

    /* Text Message Style */
    .popup-text {
        padding: 40px;
        text-align: center;
        max-width: 500px;
    }

    .popup-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 36px;
        color: #fff;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.1);
        }
    }

    .popup-title {
        font-size: 28px;
        font-weight: 700;
        color: #333;
        margin-bottom: 15px;
        background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .popup-message {
        font-size: 16px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .popup-action-btn {
        background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        color: #fff;
        border: none;
        padding: 12px 30px;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
    }

    .popup-action-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
    }

    .popup-action-btn .ml-2 {
        margin-left: 8px;
    }

    /* Popup Footer */
    .popup-footer {
        padding: 15px 20px;
        background: #f8f8f8;
        border-top: 1px solid #eee;
        text-align: center;
    }

    .popup-dont-show {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        font-size: 14px;
        color: #666;
    }

    .popup-dont-show input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #FFD700;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
        .popup-modal-container {
            max-width: 95%;
            max-height: 95vh;
        }

        .popup-text {
            padding: 30px 20px;
        }

        .popup-title {
            font-size: 24px;
        }

        .popup-message {
            font-size: 14px;
        }

        .popup-icon {
            width: 60px;
            height: 60px;
            font-size: 28px;
        }

        .popup-poster-img {
            max-height: 70vh;
        }
    }

    @media (max-width: 480px) {
        .popup-text {
            padding: 25px 15px;
        }

        .popup-title {
            font-size: 20px;
        }

        .popup-action-btn {
            padding: 10px 25px;
            font-size: 14px;
        }
    }
</style>

<!-- Popup JavaScript -->
<script>
(function() {
    'use strict';

    // Check if popup should show
    function shouldShowPopup() {
        const dontShowKey = 'popup_dont_show_{{ popup.id }}';
        const lastShown = localStorage.getItem(dontShowKey);
        
        if (lastShown) {
            const lastShownDate = new Date(lastShown);
            const today = new Date();
            const hoursSinceShown = (today - lastShownDate) / (1000 * 60 * 60);
            
            // Don't show if less than 24 hours have passed
            if (hoursSinceShown < 24) {
                return false;
            }
        }
        
        return true;
    }

    // Show popup
    function showPopup() {
        if (!shouldShowPopup()) {
            return;
        }

        const modal = document.getElementById('popupModal');
        if (modal) {
            // Small delay for better UX
            setTimeout(() => {
                modal.classList.add('show');
            }, 500);
        }
    }

    // Close popup
    function closePopup() {
        const modal = document.getElementById('popupModal');
        const dontShowCheckbox = document.getElementById('dontShowAgain');
        
        if (modal) {
            modal.classList.remove('show');
            
            // Save preference if checkbox is checked
            if (dontShowCheckbox && dontShowCheckbox.checked) {
                const dontShowKey = 'popup_dont_show_{{ popup.id }}';
                localStorage.setItem(dontShowKey, new Date().toISOString());
            }
            
            // Remove modal from DOM after animation
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }
    }

    // Initialize popup
    function initPopup() {
        const closeBtn = document.getElementById('closePopupBtn');
        const modal = document.getElementById('popupModal');
        
        if (modal) {
            // Show popup on page load
            showPopup();
            
            // Close button click
            if (closeBtn) {
                closeBtn.addEventListener('click', closePopup);
            }
            
            // Close on overlay click
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closePopup();
                }
            });
            
            // Close on Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) {
                    closePopup();
                }
            });
        }
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPopup);
    } else {
        initPopup();
    }

})();
</script>
{% endif %}
