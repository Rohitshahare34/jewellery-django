{% load static %}
<!-- ======== METAL PRICE TICKER ======== -->
<div class="price-ticker">
    <div class="ticker-wrapper">
        <div class="ticker-content" id="ticker-content">
            <!-- First set of rates (from database) -->
            {% for rate in active_rates %}
            <div class="ticker-item">
                <i class="fas fa-coins {% if 'GOLD' in rate.metal_type %}text-warning{% else %}text-secondary{% endif %}" {% if 'SILVER' in rate.metal_type %}style="color: #C0C0C0;"{% endif %}></i>
                <span class="metal-name">{{ rate.get_metal_type_display }}</span>
                <span class="metal-price">₹<span id="price-{{ rate.metal_type|lower }}">{{ rate.rate_per_gram }}</span>/g</span>
            </div>
            <div class="ticker-divider"></div>
            {% endfor %}

            <!-- Duplicate content for seamless infinite scroll -->
            {% for rate in active_rates %}
            <div class="ticker-item">
                <i class="fas fa-coins {% if 'GOLD' in rate.metal_type %}text-warning{% else %}text-secondary{% endif %}" {% if 'SILVER' in rate.metal_type %}style="color: #C0C0C0;"{% endif %}></i>
                <span class="metal-name">{{ rate.get_metal_type_display }}</span>
                <span class="metal-price">₹<span id="price-{{ rate.metal_type|lower }}-2">{{ rate.rate_per_gram }}</span>/g</span>
            </div>
            <div class="ticker-divider"></div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Link CSS and JS -->
<link class="price-ticker-style" rel="stylesheet" href="{% static 'shop/css/price_ticker.css' %}">
<script src="{% static 'shop/js/price_ticker.js' %}"></script>
