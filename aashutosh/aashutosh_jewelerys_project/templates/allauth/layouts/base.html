{% extends "shop/base.html" %}
{% load i18n %}

{% block content %}
<div class="container py-5" style="margin-top: 140px; min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div class="w-100" style="max-width: 500px;">
        <div class="card border-0 shadow-lg p-5 auth-card" style="border-radius: 16px; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(10px);">
            <!-- Alert Messages -->
            {% if messages %}
                <div class="messages mb-4">
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            
            {% block auth_content %}{% endblock %}
        </div>
    </div>
</div>

<style>
/* Styling for auth card content */
.auth-card h1 {
    font-family: 'Cinzel', serif;
    color: #1a1a1a;
    font-weight: 700;
    margin-bottom: 20px;
    border-bottom: 2px solid #FFD700;
    padding-bottom: 10px;
    font-size: 1.8rem;
    text-align: center;
}

.auth-card p {
    font-size: 0.95rem;
    color: #555;
    line-height: 1.6;
    margin-bottom: 25px;
    text-align: center;
}

.auth-card form p {
    margin-bottom: 20px;
    text-align: left;
}

.auth-card label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #222;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.auth-card input[type="text"],
.auth-card input[type="email"],
.auth-card input[type="password"],
.auth-card textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background-color: #fafafa;
}

.auth-card input[type="text"]:focus,
.auth-card input[type="email"]:focus,
.auth-card input[type="password"]:focus,
.auth-card textarea:focus {
    border-color: #FFD700;
    background-color: #fff;
    outline: none;
    box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
}

.auth-card button,
.auth-card button[type="submit"],
.auth-card .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, #FFD700 0%, #b8941f 100%);
    color: #111;
    border: none;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.auth-card button:hover,
.auth-card button[type="submit"]:hover,
.auth-card .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    color: #000;
}

.auth-card .ul-errors, 
.auth-card .errorlist {
    list-style: none;
    padding: 0;
    margin: 0 0 15px 0;
    color: #e53935;
    font-size: 0.85rem;
    font-weight: 600;
}
</style>
{% endblock %}
